<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>四面花蓉·九阶立体机械幻阵</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0c1013;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
        }

        /* 液态毛玻璃背景系统 */
        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background-color: #050709;
        }
        .liquid-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(8vh);
            opacity: 0.5;
            animation: float 12s infinite alternate ease-in-out;
        }
        .circle-emerald { /* 祖母绿 - 左上 */
            background: #50C878;
            width: max(35vw, 35vh); height: max(35vw, 35vh);
            top: -10%; left: -10%;
        }
        .circle-violet { /* 紫罗兰 - 右下 */
            background: #8A2BE2;
            width: max(40vw, 40vh); height: max(40vw, 40vh);
            bottom: -10%; right: -10%;
            animation-delay: -2s;
        }
        .circle-seablue { /* 海蓝 - 右上 */
            background: #006994;
            width: max(35vw, 35vh); height: max(35vw, 35vh);
            top: -10%; right: -10%;
            animation-delay: -4s;
        }
        .circle-magenta { /* 品红 - 左下 */
            background: #FF00FF;
            width: max(35vw, 35vh); height: max(35vw, 35vh);
            bottom: -10%; left: -10%;
            animation-delay: -6s;
        }
        .circle-orange { /* 橘黄 - 中心 */
            background: #FFAC1C;
            width: max(45vw, 45vh); height: max(45vw, 45vh);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: float-center 15s infinite alternate ease-in-out;
            opacity: 0.35;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(8%, 8%) scale(1.15); }
        }
        @keyframes float-center {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-45%, -45%) scale(1.2); }
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* 毛玻璃 UI 面板 */
        #ui-panel, .controls, #victory-overlay .win-box {
            background: rgba(20, 25, 30, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border-radius: 16px;
        }
        
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            text-align: center;
            color: #ffffff;
            pointer-events: none;
            z-index: 10;
            padding: 15px 20px;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            letter-spacing: 2px;
            color: #e0d0a0;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        p {
            margin: 0;
            font-size: 13px;
            color: #b0c0d0;
            line-height: 1.5;
        }
        .controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: auto;
            z-index: 20;
            padding: 15px 30px;
        }
        button {
            background: rgba(28, 37, 44, 0.7);
            color: #e0d0a0;
            border: 1px solid #e0d0a0;
            padding: 12px 24px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
        }
        button:hover {
            background: #e0d0a0;
            color: #1c252c;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(224, 208, 160, 0.4);
        }
        button:active {
            transform: scale(0.95);
        }
        #victory-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 50;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
        }
        #victory-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .win-box {
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .win-text {
            font-size: 42px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            margin-bottom: 25px;
            letter-spacing: 4px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
</head>
<body>

    <div class="liquid-bg">
        <div class="liquid-circle circle-emerald"></div>
        <div class="liquid-circle circle-violet"></div>
        <div class="liquid-circle circle-seablue"></div>
        <div class="liquid-circle circle-magenta"></div>
        <div class="liquid-circle circle-orange"></div>
    </div>

    <div id="ui-panel">
        <h1>Catchase · 花蓉锁 (36键)</h1>
    </div>
    
    <div id="canvas-container"></div>

    <div id="victory-overlay">
        <div class="win-box">
            <div class="win-text">阵法已破 浑然天成</div>
            <button onclick="game.shuffle()">再破一陈</button>
        </div>
    </div>

    <div class="controls">
        <button onclick="game.shuffle()">打乱</button>
        <button onclick="game.reset()">复位</button>
    </div>

    <script>
        const TextureFactory = {
            cache: {},
            createWood(colorHex, isInner=false) {
                const k = colorHex + (isInner?'_in':'_out');
                if(this.cache[k]) return this.cache[k];
                
                const size = 512; const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
                const ctx = canvas.getContext('2d');
                const col = new THREE.Color(colorHex);
                
                if(isInner) ctx.fillStyle = '#3a322e'; 
                else ctx.fillStyle = `rgb(${col.r*180}, ${col.g*180}, ${col.b*180})`;
                ctx.fillRect(0,0,size,size);
                
                ctx.globalAlpha = 0.12; ctx.globalCompositeOperation = 'multiply';
                for(let i=0;i<8000;i++) {
                    ctx.fillStyle = Math.random()>0.5?'#000':'#4e342e';
                    ctx.fillRect(Math.random()*size,Math.random()*size,Math.random()*60+20,2);
                }
                ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1.0;

                if(!isInner) {
                    const grad = ctx.createRadialGradient(size/2,size/2,size*0.3,size/2,size/2,size*0.9);
                    grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,0.5)');
                    ctx.fillStyle = grad; ctx.fillRect(0,0,size,size);
                    
                    const m = size / 2; 
                    const rootY = m; 
                    
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(255, 215, 0, 0.7)'; 
                    ctx.lineWidth = 1;
                    ctx.lineCap = 'round';

                    const totalPetals = 8;
                    
                    for (let i = 0; i < totalPetals; i++) {
                        const angle = (i * 2 * Math.PI) / totalPetals + (i * 0.05);
                        const maxReach = 82 + (i % 3) * 11; 
                        const controlOffset = 52; 
                        
                        const tipX = m + maxReach * Math.cos(angle);
                        const tipY = rootY - maxReach * Math.sin(angle); 

                        const petalGradient = ctx.createLinearGradient(m, rootY, tipX, tipY);
                        const baseRgb = `rgb(${Math.round(col.r * 255)}, ${Math.round(col.g * 255)}, ${Math.round(col.b * 255)})`;
                        const darkRgb = `rgb(${Math.round(col.r * 255 * 0.7)}, ${Math.round(col.g * 255 * 0.7)}, ${Math.round(col.b * 255 * 0.7)})`;

                        petalGradient.addColorStop(0, darkRgb); 
                        petalGradient.addColorStop(0.6, baseRgb); 
                        petalGradient.addColorStop(1, '#FFFFFF'); 

                        ctx.beginPath();
                        ctx.moveTo(m, rootY); 
                        
                        ctx.quadraticCurveTo(
                            m + controlOffset * Math.cos(angle - 0.6), rootY + controlOffset * Math.sin(angle - 0.6), 
                            tipX, tipY
                        );
                        
                        ctx.quadraticCurveTo(
                            m + controlOffset * Math.cos(angle + 0.6), rootY + controlOffset * Math.sin(angle + 0.6), 
                            m, rootY
                        );
                        
                        ctx.fillStyle = petalGradient;
                        ctx.fill();
                        
                        ctx.strokeStyle = '#FFD700'; 
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }

                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(m, rootY, 20, 0, Math.PI * 2); 
                    ctx.fillStyle = '#A07000'; 
                    ctx.fill();
                    
                } else {
                     const grad = ctx.createRadialGradient(size/2,size/2,size*0.2,size/2,size/2,size*0.9);
                     grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,0.9)');
                     ctx.fillStyle = grad; ctx.fillRect(0,0,size,size);
                }

                const tex = new THREE.CanvasTexture(canvas); tex.anisotropy=8;
                this.cache[k] = tex; return tex;
            }
        };

        class MechanicalTetrahedronPuzzle {
            constructor() {
                this.initScene();
                this.initPuzzleData();
                this.buildGeometry();
                this.setupInteractions();
                this.animate();
                this.isShuffling = false;
            }

            initScene() {
                const container = document.getElementById('canvas-container');
                this.scene = new THREE.Scene();

                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
                this.camera.position.set(0, 2, 7);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // 开启透明以透出背景
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.setClearColor(0x000000, 0); // 完全透明背景
                this.renderer.outputEncoding = THREE.sRGBEncoding;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                container.appendChild(this.renderer.domElement);

                // 切换为 TrackballControls 以实现 120Hz 高刷屏畅快无死角的全自由视角旋转
                this.controls = new THREE.TrackballControls(this.camera, this.renderer.domElement);
                this.controls.rotateSpeed = 3.0;
                this.controls.zoomSpeed = 1.2;
                this.controls.panSpeed = 0.3;
                this.controls.noZoom = false;
                this.controls.noPan = true;
                this.controls.staticMoving = false;
                this.controls.dynamicDampingFactor = 0.1;

                // 优化后的布光（匹配液态氛围）
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);

                const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.7);
                dirLight1.position.set(5, 10, 7);
                this.scene.add(dirLight1);

                const dirLight2 = new THREE.DirectionalLight(0xa0c0ff, 0.4);
                dirLight2.position.set(-5, -5, -5);
                this.scene.add(dirLight2);

                // 创建动态流光渐变环境贴图(Fake EnvMap)以增强玻璃反射质感
                const envCanvas = document.createElement('canvas');
                envCanvas.width = 256; envCanvas.height = 256;
                const envCtx = envCanvas.getContext('2d');
                const envGrad = envCtx.createLinearGradient(0, 0, 256, 256);
                envGrad.addColorStop(0, '#0d1b2a'); envGrad.addColorStop(0.5, '#415a77'); envGrad.addColorStop(1, '#e0e1dd');
                envCtx.fillStyle = envGrad; envCtx.fillRect(0, 0, 256, 256);
                const envTexture = new THREE.CanvasTexture(envCanvas);
                envTexture.mapping = THREE.EquirectangularReflectionMapping;

                const texRed = TextureFactory.createWood(0xb90000);
                const texYellow = TextureFactory.createWood(0xffd700);
                const texBlue = TextureFactory.createWood(0x0045ad);
                const texGreen = TextureFactory.createWood(0x009e60);
                const texWhite = TextureFactory.createWood(0xe6e6e6);

                this.materials = {
                    base: new THREE.MeshStandardMaterial({ 
                        color: 0x060b14, roughness: 0.08, metalness: 0.25, 
                        transparent: true, opacity: 0.85, envMap: envTexture, envMapIntensity: 2.5,
                        side: THREE.DoubleSide, depthWrite: true,
                        polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
                    }),
                    red: new THREE.MeshStandardMaterial({ map: texRed, bumpMap: texRed, bumpScale: 0.01, roughness: 0.25, metalness: 0.1, emissive: 0x000000, envMap: envTexture, envMapIntensity: 0.4 }),
                    yellow: new THREE.MeshStandardMaterial({ map: texYellow, bumpMap: texYellow, bumpScale: 0.01, roughness: 0.25, metalness: 0.1, emissive: 0x000000, envMap: envTexture, envMapIntensity: 0.4 }),
                    blue: new THREE.MeshStandardMaterial({ map: texBlue, bumpMap: texBlue, bumpScale: 0.01, roughness: 0.25, metalness: 0.1, emissive: 0x000000, envMap: envTexture, envMapIntensity: 0.4 }),
                    green: new THREE.MeshStandardMaterial({ map: texGreen, bumpMap: texGreen, bumpScale: 0.01, roughness: 0.25, metalness: 0.1, emissive: 0x000000, envMap: envTexture, envMapIntensity: 0.4 }),
                    white: new THREE.MeshStandardMaterial({ map: texWhite, bumpMap: texWhite, bumpScale: 0.01, roughness: 0.2, metalness: 0.1, emissive: 0x000000, envMap: envTexture, envMapIntensity: 0.4 })
                };

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                    this.controls.handleResize();
                });
            }

            initPuzzleData() {
                // 36个格位数据: 面0(0-8红), 面1(9-17黄), 面2(18-26蓝), 面3(27-35绿)
                this.initialState = new Array(36);
                for (let i = 0; i < 36; i++) {
                    this.initialState[i] = Math.floor(i / 9);
                }
                
                // 设置第0面(红)的正中央倒三角形为空位(白, id=4)
                // 在1,3,5阵列中，局部索引为2的是中心的倒三角
                this.initialState[2] = 4; 
                
                this.state = [...this.initialState];
                this.adj = []; // 将在 buildGeometry 环节通过空间碰撞自动生成邻接图
            }

            buildGeometry() {
                const r = 2.0; 
                const vertices = [
                    new THREE.Vector3(1, 1, 1).normalize().multiplyScalar(r),
                    new THREE.Vector3(1, -1, -1).normalize().multiplyScalar(r),
                    new THREE.Vector3(-1, 1, -1).normalize().multiplyScalar(r),
                    new THREE.Vector3(-1, -1, 1).normalize().multiplyScalar(r)
                ];

                const faceIndices = [
                    [0, 2, 1], // 面0 (前)
                    [0, 1, 3], // 面1 (右)
                    [0, 3, 2], // 面2 (左)
                    [1, 2, 3]  // 面3 (底)
                ];

                // --- 构建内部支撑底座（圆角化处理，去除四个顶角的尖锐突兀感） ---
                const baseGeometry = new THREE.BufferGeometry();
                const baseVerts = [];
                const baseUvsArray = [];
                const fBase = 0.15;

                faceIndices.forEach(idx => {
                    let A = vertices[idx[0]], B = vertices[idx[1]], C = vertices[idx[2]];
                    let faceCenter = new THREE.Vector3().addVectors(A, B).add(C).divideScalar(3);
                    let N = new THREE.Vector3().crossVectors(new THREE.Vector3().subVectors(B, A), new THREE.Vector3().subVectors(C, A)).normalize();
                    if (N.dot(faceCenter) < 0) { let tmp = B; B = C; C = tmp; }

                    let corners = [A, B, C];
                    let loopPoints = [];

                    for (let i = 0; i < 3; i++) {
                        let curr = corners[i], prev = corners[(i + 2) % 3], next = corners[(i + 1) % 3];
                        let pA = curr.clone().lerp(prev, fBase);
                        let pB = curr.clone().lerp(next, fBase);
                        for (let j = 0; j <= 4; j++) {
                            let t = j / 4;
                            let p = new THREE.Vector3().addScaledVector(pA, (1 - t) * (1 - t)).addScaledVector(curr, 2 * (1 - t) * t).addScaledVector(pB, t * t);
                            loopPoints.push(p);
                        }
                    }

                    for (let i = 0; i < loopPoints.length; i++) {
                        let p1 = loopPoints[i], p2 = loopPoints[(i + 1) % loopPoints.length];
                        baseVerts.push(faceCenter.x, faceCenter.y, faceCenter.z, p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
                        baseUvsArray.push(0.5, 0.5, 0.5, 0.5, 0.5, 0.5);
                    }
                });

                // 补全由于底座四个大角被削圆后留下的外侧缝隙面，使其圆滑过渡
                for (let i = 0; i < 4; i++) {
                    let curr = vertices[i];
                    let others = [];
                    faceIndices.forEach(idx => {
                        if (idx.includes(i)) {
                            let faceCenter = new THREE.Vector3().addVectors(vertices[idx[0]], vertices[idx[1]]).add(vertices[idx[2]]).divideScalar(3);
                            let N = new THREE.Vector3().crossVectors(new THREE.Vector3().subVectors(vertices[idx[1]], vertices[idx[0]]), new THREE.Vector3().subVectors(vertices[idx[2]], vertices[idx[0]])).normalize();
                            if (N.dot(faceCenter) < 0) N.multiplyScalar(-1);
                            
                            let pos = idx.indexOf(i);
                            let prev = vertices[idx[(pos + 2) % 3]];
                            let next = vertices[idx[(pos + 1) % 3]];
                            let pA = curr.clone().lerp(prev, fBase);
                            let pB = curr.clone().lerp(next, fBase);
                            
                            let pts = [];
                            for (let j = 0; j <= 4; j++) {
                                let t = j / 4;
                                pts.push(new THREE.Vector3().addScaledVector(pA, (1 - t) * (1 - t)).addScaledVector(curr, 2 * (1 - t) * t).addScaledVector(pB, t * t));
                            }
                            others.push({ center: faceCenter, pts: pts, normal: N });
                        }
                    });

                    if (others.length === 3) {
                        let c0 = others[0].center, c1 = others[1].center, c2 = others[2].center;
                        let edgeNorm = new THREE.Vector3().addVectors(c0, c1).add(c2).normalize();
                        if (edgeNorm.dot(curr) < 0) edgeNorm.multiplyScalar(-1);
                        
                        others.sort((a, b) => {
                            let vA = new THREE.Vector3().subVectors(a.center, curr);
                            let vB = new THREE.Vector3().subVectors(b.center, curr);
                            return new THREE.Vector3().crossVectors(vA, vB).dot(edgeNorm);
                        });

                        for (let k = 0; k < 3; k++) {
                            let o1 = others[k], o2 = others[(k + 1) % 3];
                            let arr1 = o1.pts, arr2 = o2.pts;
                            for (let m = 0; m < arr1.length; m++) {
                                baseVerts.push(curr.clone().multiplyScalar(1 - fBase).x, curr.clone().multiplyScalar(1 - fBase).y, curr.clone().multiplyScalar(1 - fBase).z, arr1[m].x, arr1[m].y, arr1[m].z, arr2[arr2.length - 1 - m].x, arr2[arr2.length - 1 - m].y, arr2[arr2.length - 1 - m].z);
                                baseUvsArray.push(0.5, 0.5, 0.5, 0.5, 0.5, 0.5);
                            }
                        }
                    }
                }

                baseGeometry.setAttribute('position', new THREE.Float32BufferAttribute(baseVerts, 3));
                baseGeometry.setAttribute('uv', new THREE.Float32BufferAttribute(baseUvsArray, 2));
                baseGeometry.computeVertexNormals();
                const baseMesh = new THREE.Mesh(baseGeometry, this.materials.base);
                this.scene.add(baseMesh);

                // --- 生成36个小三角机械按钮 ---
                this.buttons = [];
                this.triangleVertices = []; // 存储未缩放的绝对顶点用于计算邻接图

                const shrinkFactor = 0.90; // 块间距
                const extrudeHeight = 0.08; // 按键浮出高度

                faceIndices.forEach((idx, faceId) => {
                    let A = vertices[idx[0]], B = vertices[idx[1]], C = vertices[idx[2]];
                    let faceCenter = new THREE.Vector3().addVectors(A, B).add(C).divideScalar(3);
                    let N = new THREE.Vector3().crossVectors(new THREE.Vector3().subVectors(B, A), new THREE.Vector3().subVectors(C, A)).normalize();
                    if (N.dot(faceCenter) < 0) N.multiplyScalar(-1);

                    // 获取大面进行3等分后的任意坐标点公式
                    const getP = (r, c) => {
                        let wA = 3 - r;
                        let wB = r - c;
                        let wC = c;
                        return new THREE.Vector3(
                            (wA*A.x + wB*B.x + wC*C.x)/3,
                            (wA*A.y + wB*B.y + wC*C.y)/3,
                            (wA*A.z + wB*B.z + wC*C.z)/3
                        );
                    };

                    let localIdx = 0;
                    // 遍历行 0, 1, 2，产生 1, 3, 5 排列的小三角
                    for (let r = 0; r <= 2; r++) {
                        for (let c = 0; c <= r; c++) {
                            // 预设正三角形UV映射 (中心对称，适应[0,1]区间)
                            const uvU_A = new THREE.Vector2(0.5, 1.0);
                            const uvU_B = new THREE.Vector2(0.067, 0.25);
                            const uvU_C = new THREE.Vector2(0.933, 0.25);

                            const uvI_A = new THREE.Vector2(0.067, 0.75); // Top Left
                            const uvI_B = new THREE.Vector2(0.5, 0.0);    // Bottom Apex
                            const uvI_C = new THREE.Vector2(0.933, 0.75); // Top Right

                            // 构造正置的三角形 (指向上顶点A)
                            let p1 = getP(r, c);
                            let p2 = getP(r + 1, c);
                            let p3 = getP(r + 1, c + 1);
                            this.createButton(p1, p2, p3, uvU_A, uvU_B, uvU_C, N, faceId, localIdx++, shrinkFactor, extrudeHeight);

                            // 构造倒置的三角形
                            if (c < r) {
                                let p4 = getP(r, c);       // Top Left
                                let p5 = getP(r + 1, c + 1); // Bottom Apex
                                let p6 = getP(r, c + 1);   // Top Right
                                this.createButton(p4, p5, p6, uvI_A, uvI_B, uvI_C, N, faceId, localIdx++, shrinkFactor, extrudeHeight);
                            }
                        }
                    }
                });

                // --- 自动计算3D空间中的36节点跨面邻接图 ---
                this.generateAdjacencyGraph();
                this.updateVisuals();
            }

            createButton(vA, vB, vC, uvA, uvB, uvC, N, faceId, localIdx, shrinkFactor, extrudeHeight) {
                // 确保法线方向构造顺序正确
                let cross = new THREE.Vector3().crossVectors(
                    new THREE.Vector3().subVectors(vB, vA),
                    new THREE.Vector3().subVectors(vC, vA)
                );
                if (cross.dot(N) < 0) {
                    let temp = vB; vB = vC; vC = temp;
                    let tempUv = uvB; uvB = uvC; uvC = tempUv; // 同步反转UV映射
                }

                this.triangleVertices.push([vA, vB, vC]); // 记录绝对顶点用于邻接计算

                // 向自身重心收缩出缝隙
                let cSub = new THREE.Vector3().addVectors(vA, vB).add(vC).divideScalar(3);
                let v1 = new THREE.Vector3().subVectors(vA, cSub).multiplyScalar(shrinkFactor).add(cSub);
                let v2 = new THREE.Vector3().subVectors(vB, cSub).multiplyScalar(shrinkFactor).add(cSub);
                let v3 = new THREE.Vector3().subVectors(vC, cSub).multiplyScalar(shrinkFactor).add(cSub);

                let f = 0.22;
                let corners = [v1, v2, v3];
                let uvsCorners = [uvA, uvB, uvC];
                let loopPoints = [];
                let loopUvs = [];

                for (let i = 0; i < 3; i++) {
                    let curr = corners[i], prev = corners[(i + 2) % 3], next = corners[(i + 1) % 3];
                    let cuv = uvsCorners[i], puv = uvsCorners[(i + 2) % 3], nuv = uvsCorners[(i + 1) % 3];
                    let pA = curr.clone().lerp(prev, f), uvA_pt = cuv.clone().lerp(puv, f);
                    let pB = curr.clone().lerp(next, f), uvB_pt = cuv.clone().lerp(nuv, f);
                    for (let j = 0; j <= 4; j++) {
                        let t = j / 4;
                        let p = new THREE.Vector3().addScaledVector(pA, (1 - t) * (1 - t)).addScaledVector(curr, 2 * (1 - t) * t).addScaledVector(pB, t * t);
                        let uv = new THREE.Vector2().addScaledVector(uvA_pt, (1 - t) * (1 - t)).addScaledVector(cuv, 2 * (1 - t) * t).addScaledVector(uvB_pt, t * t);
                        loopPoints.push(p);
                        loopUvs.push(uv);
                    } 
                }

                const geometry = new THREE.BufferGeometry();
                let verts = [];
                let uvs = [];
                let cSub_top = cSub.clone().addScaledVector(N, extrudeHeight);
                let cSub_uv = new THREE.Vector2().addVectors(uvA, uvB).add(uvC).divideScalar(3);

                for (let i = 0; i < loopPoints.length; i++) {
                    let p1 = loopPoints[i], p2 = loopPoints[(i + 1) % loopPoints.length];
                    let u1 = loopUvs[i], u2 = loopUvs[(i + 1) % loopUvs.length];
                    let p1_top = p1.clone().addScaledVector(N, extrudeHeight);
                    let p2_top = p2.clone().addScaledVector(N, extrudeHeight);

                    verts.push(cSub_top.x, cSub_top.y, cSub_top.z, p1_top.x, p1_top.y, p1_top.z, p2_top.x, p2_top.y, p2_top.z);
                    uvs.push(cSub_uv.x, cSub_uv.y, u1.x, u1.y, u2.x, u2.y);

                    verts.push(cSub.x, cSub.y, cSub.z, p2.x, p2.y, p2.z, p1.x, p1.y, p1.z);
                    uvs.push(cSub_uv.x, cSub_uv.y, u2.x, u2.y, u1.x, u1.y);

                    verts.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z, p2_top.x, p2_top.y, p2_top.z);
                    uvs.push(0.1, 0.9, 0.1, 0.9, 0.1, 0.9);
                    verts.push(p1.x, p1.y, p1.z, p2_top.x, p2_top.y, p2_top.z, p1_top.x, p1_top.y, p1_top.z);
                    uvs.push(0.1, 0.9, 0.1, 0.9, 0.1, 0.9);
                }

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
                geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                geometry.computeVertexNormals();

                const buttonMesh = new THREE.Mesh(geometry, this.materials.white);
                
                buttonMesh.userData = {
                    index: faceId * 9 + localIdx,
                    normal: N.clone(),
                    isPressed: false,
                    animProgress: 0,
                    onPressPeak: null
                };

                this.scene.add(buttonMesh);
                this.buttons.push(buttonMesh);
            }

            generateAdjacencyGraph() {
                // 如果两个三角块共有两个相同的顶点，则它们在空间中共边相邻 (包含跨面相接的情况)
                for (let i = 0; i < 36; i++) this.adj[i] = [];
                const isSame = (p1, p2) => p1.distanceTo(p2) < 0.001;

                for (let i = 0; i < 36; i++) {
                    for (let j = i + 1; j < 36; j++) {
                        let shared = 0;
                        let triA = this.triangleVertices[i];
                        let triB = this.triangleVertices[j];
                        for(let a = 0; a < 3; a++) {
                            for(let b = 0; b < 3; b++) {
                                if (isSame(triA[a], triB[b])) {
                                    shared++;
                                    break;
                                }
                            }
                        }
                        if (shared === 2) {
                            this.adj[i].push(j);
                            this.adj[j].push(i);
                        }
                    }
                }
            }

            setupInteractions() {
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                let isDragging = false, startPos = { x: 0, y: 0 };

                window.addEventListener('pointerdown', e => {
                    isDragging = false;
                    startPos = { x: e.clientX, y: e.clientY };
                });

                window.addEventListener('pointermove', e => {
                    if (Math.hypot(e.clientX - startPos.x, e.clientY - startPos.y) > 6) isDragging = true;
                });

                window.addEventListener('pointerup', e => {
                    if (isDragging || this.isShuffling || e.target.closest('button')) return;

                    this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    this.raycaster.setFromCamera(this.mouse, this.camera);

                    const intersects = this.raycaster.intersectObjects(this.buttons);
                    if (intersects.length > 0) {
                        this.trySwap(intersects[0].object);
                    }
                });
            }

            trySwap(hitButton) {
                if (hitButton.userData.animProgress === 0 && !hitButton.userData.isPressed) {
                    const clickedIndex = hitButton.userData.index;
                    const emptyIndex = this.state.indexOf(4); 

                    // 检验点击格是否与白色空缺格相邻
                    if (this.adj[emptyIndex].includes(clickedIndex)) {
                        hitButton.userData.isPressed = true;
                        // 机械压入到最深点时触发状态逻辑变换
                        hitButton.userData.onPressPeak = () => {
                            this.state[emptyIndex] = this.state[clickedIndex];
                            this.state[clickedIndex] = 4;
                            this.updateVisuals();
                            this.checkWin();
                        };
                    } else {
                        // 播放错误拒止动画 (仅点击不滑动)
                        hitButton.userData.isPressed = true;
                        hitButton.userData.onPressPeak = null;
                    }
                }
            }

            updateVisuals() {
                for (let i = 0; i < 36; i++) {
                    let colorId = this.state[i];
                    let mat = this.materials.white;
                    if (colorId === 0) mat = this.materials.red;
                    else if (colorId === 1) mat = this.materials.yellow;
                    else if (colorId === 2) mat = this.materials.blue;
                    else if (colorId === 3) mat = this.materials.green;
                    else if (colorId === 4) mat = this.materials.white;
                    this.buttons[i].material = mat;
                }
            }

            shuffle() {
                if (this.isShuffling) return;
                this.isShuffling = true;
                document.getElementById('victory-overlay').classList.remove('show');

                let count = 0;
                const totalSteps = 60;
                let lastEmpty = -1;

                const doStep = () => {
                    let emptyIdx = this.state.indexOf(4);
                    let neighbors = this.adj[emptyIdx].filter(n => n !== lastEmpty);
                    if (neighbors.length === 0) neighbors = this.adj[emptyIdx];

                    let randomNext = neighbors[Math.floor(Math.random() * neighbors.length)];
                    
                    let targetBtn = this.buttons[randomNext];
                    targetBtn.userData.isPressed = true;
                    targetBtn.userData.animProgress = 0.0;
                    
                    targetBtn.userData.onPressPeak = () => {
                        this.state[emptyIdx] = this.state[randomNext];
                        this.state[randomNext] = 4;
                        this.updateVisuals();
                        
                        lastEmpty = emptyIdx;
                        count++;

                        if (count < totalSteps) {
                            setTimeout(doStep, 35);
                        } else {
                            this.isShuffling = false;
                        }
                    };
                };
                doStep();
            }

            reset() {
                if (this.isShuffling) return;
                this.state = [...this.initialState];
                this.updateVisuals();
                document.getElementById('victory-overlay').classList.remove('show');
                this.camera.position.set(0, 2, 7);
                this.controls.reset();
            }

            checkWin() {
                let isWin = true;
                for (let i = 0; i < 36; i++) {
                    if (this.state[i] !== this.initialState[i]) {
                        isWin = false;
                        break;
                    }
                }
                if (isWin) {
                    document.getElementById('victory-overlay').classList.add('show');
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.controls.update();

                const maxPressDepth = 0.08; // 按下深度

                this.buttons.forEach(btn => {
                    if (btn.userData.isPressed) {
                        btn.userData.animProgress += 0.28; // 触击压入速度
                        if (btn.userData.animProgress >= 1) {
                            btn.userData.animProgress = 1;
                            btn.userData.isPressed = false;
                            
                            if (typeof btn.userData.onPressPeak === 'function') {
                                btn.userData.onPressPeak();
                                btn.userData.onPressPeak = null;
                            }
                        }
                    } else if (btn.userData.animProgress > 0) {
                        btn.userData.animProgress -= 0.1; // 机械阻尼回弹速度
                        if (btn.userData.animProgress < 0) btn.userData.animProgress = 0;
                    }

                    // 沿按钮自身面法线的反方向产生下陷位移
                    const offset = -maxPressDepth * btn.userData.animProgress;
                    btn.position.set(0, 0, 0).addScaledVector(btn.userData.normal, offset);
                });

                this.renderer.render(this.scene, this.camera);
            }
        }

        const game = new MechanicalTetrahedronPuzzle();
    </script>
</body>
</html>
